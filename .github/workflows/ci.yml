name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: JS — build · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      # During bootstrap migration, individual app builds may fail
      # (legacy package.json scripts ran in their old repo context).
      # Tolerate so the workspace itself proves out; we'll harden per-
      # app in follow-up PRs.
      - run: pnpm run build || true
      - run: pnpm run lint || true
      - run: pnpm run test || true

  dipay-callback-key:
    name: Dipay callback verification completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BAP dependencies and canonical wheel
        run: |
          python -m venv apps/beli-aman-bap/.venv
          apps/beli-aman-bap/.venv/bin/python -m pip wheel --no-deps ./packages/beckn-protocol-py --wheel-dir /tmp/protocol-wheel
          apps/beli-aman-bap/.venv/bin/python -m pip install /tmp/protocol-wheel/*.whl -r apps/beli-aman-bap/requirements.txt pytest pytest-asyncio
      - name: Run isolated offline Dipay regressions (blocking)
        run: >-
          apps/beli-aman-bap/.venv/bin/python -I
          apps/beli-aman-bap/scripts/test-dipay-callback-key.py
          test_dipay_callback_key.py test_dipay_client.py test_dipay_invoices.py
          test_webhooks_dipay.py test_routes_dipay_invoice.py

  python:
    name: Python — lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync
      # ruff + pytest only run if there's actual Python code to check.
      # Empty workspace skips these (the workspace members list is
      # commented out in pyproject.toml until packages are migrated).
      - run: |
          if find packages apps -name '*.py' -not -path '*/.venv/*' 2>/dev/null | grep -q .; then
            uv tool run ruff check . || true   # warn, don't fail (bootstrap)
            uv run pytest --ignore=apps/onboarding-portal --ignore=apps/registry --ignore=apps/gateway -q 2>&1 | tail -30 || true
          else
            echo "No Python sources yet — skipping ruff + pytest"
          fi
