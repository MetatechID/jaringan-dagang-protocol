name: Identity security

on:
  pull_request:
  push:
    branches: [main, pre-main]

permissions:
  contents: read

jobs:
  identity-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install canonical protocol wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/protocol-wheels ./packages/beckn-protocol-py
          python -m pip install /tmp/protocol-wheels/*.whl
      - name: Install app and test dependencies
        run: python -m pip install -r apps/beli-aman-bap/requirements.txt pytest pytest-asyncio aiosqlite
      - name: Run isolated identity and merchant authorization regressions
        run: python -I apps/beli-aman-bap/scripts/test-identity-security.py
