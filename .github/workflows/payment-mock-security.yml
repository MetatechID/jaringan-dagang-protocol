name: Payment mock security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  payment-mock-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BAP dependencies and canonical protocol wheel
        run: |
          python -m venv apps/beli-aman-bap/.venv
          apps/beli-aman-bap/.venv/bin/python -m pip install -r apps/beli-aman-bap/requirements.txt pytest pytest-asyncio
          apps/beli-aman-bap/.venv/bin/python -m pip wheel --no-deps packages/beckn-protocol-py --wheel-dir /tmp/protocol-wheel
          apps/beli-aman-bap/.venv/bin/python -m pip install /tmp/protocol-wheel/*.whl
      - name: Run isolated offline payment security regressions
        run: >-
          apps/beli-aman-bap/.venv/bin/python -I
          apps/beli-aman-bap/scripts/test-provider-mock-security.py
          tests/test_provider_mock_security.py
          tests/test_oy_invoices.py tests/test_sento_invoices.py
          tests/test_oy_client.py tests/test_sento_client.py
          tests/test_partner_integration.py
