[project]
name = "jaringan-dagang-ops"
version = "0.1.0"
description = "Operability primitives for Jaringan Dagang services: W3C trace context, OTel-shaped spans, partner HTTP exchange evidence with an ours-vs-partner error class, and JSON logs."
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "MetatechID" }]
keywords = ["observability", "tracing", "audit", "commerce", "indonesia"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/MetatechID/jaringan-dagang-protocol"
Source = "https://github.com/MetatechID/jaringan-dagang-protocol/tree/main/packages/ops-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaringan_dagang_ops"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md"]
